# auto-tag.yml
#
# Triggers on CI success (`workflow_run` of ci.yml) and pushes a new semver
# tag -- but only when CHANGELOG.md has unreleased entries under
# `## [Unreleased]`. An empty `[Unreleased]` means there is nothing to
# release, so the tag step is skipped.
#
# That gate is not optional. Without it this workflow tagged unconditionally
# on every green CI run, and produced `v0.6.1` pointing at a commit already
# released as v0.6.0.
#
# Per nick.md: tag pushes via GITHUB_TOKEN do NOT trigger downstream
# `on: push: tags` workflows (loop prevention). The downstream release
# workflow chains off this one via `on: workflow_run`, which sidesteps
# the loop-prevention block.
#
# The git identity is explicitly set to Nick Campbell (per AGENTS.md).

name: auto-tag

on:
  workflow_run:
    workflows: ['ci']
    types: [completed]

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-tag:
    name: Auto-tag on CI green
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configure git identity (Nick Campbell)
        # AGENTS.md: never leave the default github-actions[bot] identity in
        # any commit.
        run: |
          git config user.name 'Nick Campbell'
          git config user.email '[email protected]'

      # Release gate. This workflow used to tag unconditionally on every
      # green CI run, which produced `v0.6.1` pointing at a commit already
      # released as v0.6.0 -- a tag for a version that was never built.
      #
      # Keep a Changelog convention: entries pending release live under
      # `## [Unreleased]`; release prep moves them under a dated version
      # heading. Empty `[Unreleased]` therefore means nothing to release.
      - name: Check for unreleased CHANGELOG entries
        id: changelog
        run: |
          if bash scripts/changelog-has-unreleased.sh; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No unreleased CHANGELOG entries -- skipping tag."
          fi

      - name: Read latest tag
        id: read-tag
        run: |
          latest=$(git tag --sort=-v:refname | head -n 1 || echo 'v0.0.0')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Compute next tag
        id: next-tag
        run: |
          latest="${{ steps.read-tag.outputs.latest }}"
          next=$(LATEST_TAG="$latest" bash scripts/next-tag.sh)
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Push tag
        # Gated: only tags when [Unreleased] has real bullet entries.
        if: steps.changelog.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.next-tag.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$TAG" HEAD
          git push origin "$TAG"
