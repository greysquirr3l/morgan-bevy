# morgan-bevy — Continuous Integration
#
# Runs on every push and PR. Three jobs:
#   1. frontend — npm ci, lint, type-check, vitest, vite build
#   2. backend  — cargo check, test, clippy (full pedantic profile), cargo-deny
#   3. release-readiness — sanity check that dist/ exists for the release pipeline
#
# Per nick.md:
#   - sccache is unreliable here (permission errors). Disable it explicitly.
#   - cargo-deny must always fetch fresh advisories in CI — local cache can
#     be stale and miss real advisories.
#   - All git commit activity must use the greysquirr3l identity (see T67).
#
# Per AGENTS.md and T66:
#   - The clippy invocation matches the local `l` alias from .cargo/config.toml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Allow manual runs from the Actions tab. Useful for verifying a
    # workflow change before pushing to a feature branch.

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disable sccache — fails with permission errors on hosted runners
  # (per nick.md "When sccache fails with permission errors, run with
  # RUSTC_WRAPPER= SCCACHE_DISABLE=1 cargo clippy ...").
  RUSTC_WRAPPER: ""
  SCCACHE_DISABLE: "1"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─── Frontend (TypeScript + Vite + Vitest) ──────────────────────────────────
  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — matches the project baseline documented in
          # AGENTS.md. The `@types/node` is pinned at ^26 which the
          # project happily compiles against on Node 22+.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ─── Backend (Rust + Cargo + clippy + cargo-deny) ──────────────────────────
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-deny (prebuilt)
        # Prebuilt binary is ~10x faster than `cargo install --locked`
        # and avoids pulling a second Rust toolchain into the runner.
        uses: taiki-e/install-action@cargo-deny
        with:
          version: "0.16"

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy (full pedantic profile)
        # Matches the local `just lint-rust` recipe exactly. Any flag
        # drift here will fail locally too; the gate is enforced by
        # AGENTS.md / T66.
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- \
            -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W clippy::perf \
            -A clippy::module_name_repetitions -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc -A clippy::missing_panics_doc \
            -A clippy::struct_excessive_bools -A clippy::multiple_crate_versions \
            -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic \
            -D clippy::indexing_slicing -D clippy::cast_ptr_alignment -D clippy::suspicious \
            -D warnings

      - name: cargo build (debug, all targets)
        # A debug build verifies the Rust source compiles across the
        # full matrix without the cost of a full release installer
        # (which is covered by the release workflow).
        run: cargo build --manifest-path src-tauri/Cargo.toml --all-targets

      - name: cargo-deny (fresh advisories)
        # Per nick.md, always fetch in CI — local cache can be stale
        # and miss real advisories.
        run: scripts/cargo-deny.sh

  # ─── Workflow lint (actionlint) ────────────────────────────────────────────
  # Lints the workflow files for syntax errors and common mistakes. Runs only
  # on ubuntu (actionlint is a single static binary). The full image tag is
  # pinned; renovate or dependabot should bump it.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
        # T67 / T65: bump the tag via Renovate / Dependabot rather
        # than editing the workflow file.
